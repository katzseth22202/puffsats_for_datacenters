<?xml version="1.0" encoding="UTF-8"?>
<!-- PuffSat collision: the two ways one ship catches PuffSats, drawn in the ship's frame
     with no orbit so it serves the LEO and Jupiter cases alike. The ship travels to the
     right in both panels.
     (a) Pusher plate, growth wave: PuffSats overtake from behind, the nearest already a
     gas cloud; nozzles on the skirt's lip spray an argon cloud ahead of the bowl. The
     skirt hangs on a frame fixed to the ship, and the bowl floor rides on gas springs
     and slides inside it (plate_stack has the detail).
     (b) Pulsed nozzle, departure wave: PuffSats meet the ship nearly head-on, the nearest
     still a solid rod; it enters the port in the ship's forward face, erodes into the
     plug and turns to plasma with the charge, and the gas leaves through the throat.
     Panel (b) mirrors rod_port_plug.svg left to right.
     Not to scale. Detail stops short of plate_stack, rod_port_plug and chamber_cooling,
     which the caption points to.
     Each element sits in a named Inkscape layer.
     Export for the paper with:
       inkscape images/puffsat_collision.svg -o images/puffsat_collision.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1000" height="790" viewBox="0 0 1000 790">
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" inkscape:document-units="px"/>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; }
      .title { font-size: 19px; font-weight: bold; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
      .gas { stroke: #C77D1A; stroke-width: 3; fill: none; }
      .flow { stroke: #1F5F8B; stroke-width: 2.5; fill: none; }
      .wall { stroke: #5E6A73; stroke-width: 5; fill: none; }
      .stream { stroke: #999; stroke-width: 2; stroke-dasharray: 2 7; fill: none; }
    </style>
    <marker id="arrowGas" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M 0,2 L 18,9 L 0,16 Z" fill="#C77D1A"/>
    </marker>
    <marker id="arrowFlow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#1F5F8B"/>
    </marker>
    <marker id="arrowDark" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#333"/>
    </marker>
    <marker id="arrowBig" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto">
      <path d="M 0,3 L 24,12 L 0,21 Z" fill="#333"/>
    </marker>
    <pattern id="foam" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#C9D3DA"/>
      <circle cx="1.5" cy="1.6" r="1.0" fill="#ffffff"/>
      <circle cx="3.9" cy="3.8" r="0.8" fill="#ffffff"/>
    </pattern>
    <!-- Small arrow showing the ship's direction of travel, used in both panels. -->
    <g id="travel">
      <text x="0" y="0" class="small" text-anchor="end">ship travels</text>
      <line x1="10" y1="-5" x2="70" y2="-5" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
    </g>
  </defs>
  <rect id="background" width="1000" height="790" fill="#ffffff"/>

  <!-- ===================== (a) Pusher plate, growth wave ===================== -->
  <g inkscape:groupmode="layer" id="layer-a-title" inkscape:label="(a) Title">
    <text x="20" y="28" class="title">(a) Pusher plate, growth wave</text>
    <use href="#travel" transform="translate(890,28)"/>
  </g>

  <g inkscape:groupmode="layer" id="layer-a-stream" inkscape:label="(a) PuffSat stream">
    <line x1="20" y1="200" x2="160" y2="200" class="stream"/>
    <circle cx="45" cy="200" r="8" fill="#9AA5AE" stroke="#5E6A73" stroke-width="1.3"/>
    <circle cx="115" cy="200" r="8" fill="#9AA5AE" stroke="#5E6A73" stroke-width="1.3"/>
    <!-- Nearest PuffSat, dispersed into an edge-on gas disk. -->
    <ellipse cx="200" cy="200" rx="18" ry="95" fill="#F6C177" fill-opacity="0.75" stroke="#C77D1A" stroke-width="1.5"/>
    <line x1="232" y1="200" x2="340" y2="200" class="gas" marker-end="url(#arrowGas)"/>
    <text x="286" y="188" text-anchor="middle" font-style="italic">w</text>
    <text x="20" y="330" class="small">PuffSats overtake from behind;</text>
    <text x="20" y="348" class="small">the nearest has dispersed into gas</text>
    <line x1="150" y1="316" x2="192" y2="280" class="leader"/>
  </g>

  <g inkscape:groupmode="layer" id="layer-a-slug" inkscape:label="(a) Skirt nozzles and argon cloud">
    <!-- The cloud stands off the floor; nozzles sit on the skirt's lip. -->
    <path d="M 392,58 L 404,58 L 404,70 L 396,72 Z" fill="#555"/>
    <path d="M 392,342 L 404,342 L 404,330 L 396,328 Z" fill="#555"/>
    <g fill="#3A7BD5">
      <circle cx="400.0" cy="159.8" r="2.1"/><circle cx="393.9" cy="234.4" r="2.1"/><circle cx="418.7" cy="208.2" r="2.1"/><circle cx="417.0" cy="99.2" r="2.1"/><circle cx="411.7" cy="94.5" r="2.1"/>
      <circle cx="393.3" cy="101.9" r="2.1"/><circle cx="456.8" cy="182.8" r="2.1"/><circle cx="402.4" cy="114.2" r="2.1"/><circle cx="465.5" cy="229.1" r="2.1"/><circle cx="421.0" cy="217.6" r="2.1"/>
      <circle cx="390.5" cy="308.6" r="2.1"/><circle cx="407.2" cy="281.7" r="2.1"/><circle cx="395.8" cy="118.9" r="2.1"/><circle cx="452.4" cy="156.3" r="2.1"/><circle cx="428.7" cy="127.2" r="2.1"/>
      <circle cx="418.3" cy="231.7" r="2.1"/><circle cx="393.3" cy="210.9" r="2.1"/><circle cx="399.8" cy="99.6" r="2.1"/><circle cx="422.0" cy="241.1" r="2.1"/><circle cx="434.4" cy="157.6" r="2.1"/>
      <circle cx="413.1" cy="189.3" r="2.1"/><circle cx="438.4" cy="267.1" r="2.1"/><circle cx="431.1" cy="141.7" r="2.1"/><circle cx="461.4" cy="205.7" r="2.1"/><circle cx="410.1" cy="252.3" r="2.1"/>
      <circle cx="394.2" cy="309.5" r="2.1"/><circle cx="450.9" cy="181.3" r="2.1"/><circle cx="420.9" cy="120.7" r="2.1"/><circle cx="424.6" cy="94.9" r="2.1"/><circle cx="430.6" cy="260.3" r="2.1"/>
      <circle cx="408.3" cy="285.6" r="2.1"/><circle cx="434.8" cy="244.5" r="2.1"/><circle cx="425.9" cy="218.2" r="2.1"/><circle cx="452.3" cy="277.5" r="2.1"/><circle cx="443.7" cy="194.1" r="2.1"/>
      <circle cx="428.3" cy="99.8" r="2.1"/><circle cx="468.5" cy="233.5" r="2.1"/><circle cx="407.8" cy="273.4" r="2.1"/><circle cx="443.0" cy="174.0" r="2.1"/><circle cx="412.3" cy="91.1" r="2.1"/>
      <circle cx="396.1" cy="124.3" r="2.1"/><circle cx="432.0" cy="99.4" r="2.1"/><circle cx="404.1" cy="115.5" r="2.1"/><circle cx="459.8" cy="175.1" r="2.1"/><circle cx="414.9" cy="104.4" r="2.1"/>
      <circle cx="461.9" cy="211.3" r="2.1"/><circle cx="448.5" cy="272.8" r="2.1"/><circle cx="420.1" cy="149.5" r="2.1"/><circle cx="459.8" cy="167.8" r="2.1"/><circle cx="396.3" cy="304.4" r="2.1"/>
      <circle cx="404.1" cy="126.2" r="2.1"/><circle cx="424.0" cy="139.2" r="2.1"/><circle cx="409.8" cy="220.3" r="2.1"/><circle cx="409.0" cy="86.9" r="2.1"/><circle cx="434.2" cy="170.2" r="2.1"/>
      <circle cx="426.5" cy="303.3" r="2.1"/><circle cx="439.9" cy="203.5" r="2.1"/><circle cx="392.3" cy="240.2" r="2.1"/><circle cx="436.4" cy="291.1" r="2.1"/><circle cx="439.6" cy="285.4" r="2.1"/>
      <circle cx="420.9" cy="175.5" r="2.1"/><circle cx="427.6" cy="109.6" r="2.1"/><circle cx="391.9" cy="100.2" r="2.1"/><circle cx="399.7" cy="133.6" r="2.1"/><circle cx="392.2" cy="163.5" r="2.1"/>
      <circle cx="395.5" cy="86.1" r="2.1"/><circle cx="410.6" cy="109.1" r="2.1"/><circle cx="434.4" cy="91.8" r="2.1"/><circle cx="400.2" cy="226.0" r="2.1"/><circle cx="414.2" cy="143.5" r="2.1"/>
    </g>
    <text x="250" y="380" class="small">argon sprayed from the skirt's lip</text>
    <line x1="350" y1="366" x2="398" y2="300" class="leader"/>
  </g>

  <g inkscape:groupmode="layer" id="layer-a-exhaust" inkscape:label="(a) Mixture leaving">
    <line x1="376" y1="122" x2="290" y2="94" class="flow" marker-end="url(#arrowFlow)"/>
    <line x1="376" y1="278" x2="290" y2="306" class="flow" marker-end="url(#arrowFlow)"/>
    <text x="280" y="80" class="small" text-anchor="end">gas and slug</text>
    <text x="280" y="98" class="small" text-anchor="end">leave backward</text>
  </g>

  <g inkscape:groupmode="layer" id="layer-a-plate" inkscape:label="(a) Bowl, skirt, frame and gas springs">
    <!-- Skirt: steel liner in a carbon hoop wrap, on a frame fixed to the ship. -->
    <rect x="400" y="62" width="50" height="8" fill="#555"/>
    <rect x="400" y="330" width="50" height="8" fill="#555"/>
    <path d="M 425,62 L 425,48 L 630,48 L 630,70" stroke="#333" stroke-width="2.5" fill="none"/>
    <path d="M 425,338 L 425,352 L 630,352 L 630,330" stroke="#333" stroke-width="2.5" fill="none"/>
    <!-- Bowl floor, maraging steel, sliding inside the skirt. -->
    <path d="M 446,74 Q 530,200 446,326" stroke="#5E6A73" stroke-width="8" fill="none"/>
    <g fill="#EFE3B8" stroke="#8C7A3A" stroke-width="2">
      <ellipse cx="546" cy="118" rx="22" ry="30"/>
      <ellipse cx="596" cy="118" rx="22" ry="30"/>
      <ellipse cx="546" cy="282" rx="22" ry="30"/>
      <ellipse cx="596" cy="282" rx="22" ry="30"/>
      <ellipse cx="546" cy="200" rx="22" ry="30"/>
      <ellipse cx="596" cy="200" rx="22" ry="30"/>
    </g>
    <text x="470" y="30" class="small">skirt on a frame fixed to the ship</text>
    <line x1="480" y1="34" x2="452" y2="48" class="leader"/>
    <text x="560" y="380" class="small">gas springs</text>
    <line x1="586" y1="366" x2="596" y2="314" class="leader"/>
      </g>

  <g inkscape:groupmode="layer" id="layer-a-ship" inkscape:label="(a) Ship, aft end">
    <path d="M 624,70 L 955,70 L 945,135 L 965,200 L 945,265 L 955,330 L 624,330 Z"
          fill="#E4E9ED" stroke="#7F8C96" stroke-width="2"/>
    <rect x="624" y="70" width="12" height="260" fill="#7F8C96"/>
    <text x="656" y="100">ship, aft end</text>
    <line x1="680" y1="270" x2="900" y2="270" stroke="#333" stroke-width="5" marker-end="url(#arrowBig)"/>
    <text x="690" y="256">thrust</text>
  </g>

  <line x1="20" y1="392" x2="980" y2="392" stroke="#DDD" stroke-width="1"/>

  <!-- ===================== (b) Pulsed nozzle, departure wave ===================== -->
  <g inkscape:groupmode="layer" id="layer-b-title" inkscape:label="(b) Title">
    <text x="20" y="428" class="title">(b) Pulsed nozzle, departure wave</text>
    <use href="#travel" transform="translate(890,428)"/>
  </g>

  <g transform="translate(0,400)">
    <g inkscape:groupmode="layer" id="layer-b-chamber" inkscape:label="(b) Chamber, face and plug">
      <!-- Chamber centre (520,190), r = 140; port gap on the right, throat on the left. -->
      <circle cx="520" cy="190" r="138" fill="#E3F0FA"/>
      <path d="M 659.77,182 A 140 140 0 0 0 381.44,170" class="wall"/>
      <path d="M 381.44,210 A 140 140 0 0 0 659.77,198" class="wall"/>
      <path d="M 381.44,170 C 345,164 310,140 275,118" class="wall"/>
      <path d="M 381.44,210 C 345,216 310,240 275,262" class="wall"/>
      <!-- Ship's forward face with the port. -->
      <rect x="664" y="40" width="10" height="134" fill="#7F8C96"/>
      <rect x="664" y="206" width="10" height="134" fill="#7F8C96"/>
      <rect x="659" y="172" width="21" height="10" fill="#C9A227" stroke="#8A6D12" stroke-width="1"/>
      <rect x="659" y="198" width="21" height="10" fill="#C9A227" stroke="#8A6D12" stroke-width="1"/>
      <!-- Foam plug, front face at the chamber's centre, reaching toward the throat. -->
      <rect x="440" y="185.5" width="80" height="9" fill="url(#foam)" stroke="#5E6F7C" stroke-width="1.2"/>
      <text x="520" y="110" text-anchor="middle">charge</text>
    </g>

    <g inkscape:groupmode="layer" id="layer-b-rod" inkscape:label="(b) Rod stream">
      <line x1="780" y1="190" x2="990" y2="190" class="stream"/>
      <g opacity="0.55">
        <rect x="868" y="186.7" width="34" height="6.6" rx="1.5" fill="#B8C2CA" stroke="#4A90B8" stroke-width="1.4"/>
        <rect x="944" y="186.7" width="34" height="6.6" rx="1.5" fill="#B8C2CA" stroke="#4A90B8" stroke-width="1.4"/>
      </g>
      <!-- Nearest PuffSat, still a solid rod. -->
      <rect x="716" y="186.7" width="50" height="6.6" rx="1.5" fill="#B8C2CA" stroke="#4A90B8" stroke-width="1.4"/>
      <line x1="900" y1="150" x2="790" y2="150" stroke="#333" stroke-width="2.5" marker-end="url(#arrowBig)"/>
      <text x="845" y="138" class="small" text-anchor="middle">68–75 km/s</text>
      <text x="980" y="246" class="small" text-anchor="end">PuffSats meet the ship head-on;</text>
      <text x="980" y="264" class="small" text-anchor="end">the nearest is still a solid rod</text>
      <line x1="800" y1="232" x2="748" y2="196" class="leader"/>
    </g>

    <g inkscape:groupmode="layer" id="layer-b-exhaust" inkscape:label="(b) Exhaust and thrust">
      <line x1="300" y1="190" x2="215" y2="190" class="flow" marker-end="url(#arrowFlow)"/>
      <line x1="292" y1="160" x2="215" y2="138" class="flow" marker-end="url(#arrowFlow)"/>
      <line x1="292" y1="220" x2="215" y2="242" class="flow" marker-end="url(#arrowFlow)"/>
      <line x1="730" y1="330" x2="930" y2="330" stroke="#333" stroke-width="5" marker-end="url(#arrowBig)"/>
      <text x="740" y="316">thrust</text>
    </g>

    <g inkscape:groupmode="layer" id="layer-b-labels" inkscape:label="(b) Labels">
      <text x="692" y="70" class="small">port in the ship's</text>
      <text x="692" y="88" class="small">forward face</text>
      <line x1="712" y1="94" x2="680" y2="168" class="leader"/>
      <text x="300" y="356" class="small">the rod erodes into the plug; both turn</text>
      <text x="300" y="374" class="small">to plasma with the charge</text>
      <line x1="420" y1="342" x2="476" y2="198" class="leader"/>
      <text x="300" y="98" class="small" text-anchor="middle">throat</text>
      <line x1="312" y1="104" x2="372" y2="164" class="leader"/>
      <text x="200" y="300" class="small" text-anchor="end">gas leaves</text>
      <text x="200" y="318" class="small" text-anchor="end">backward</text>
    </g>
  </g>
</svg>
